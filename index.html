<style>
  :root {
    --felt-1: #5a1620; --felt-2: #3a0d12; --felt-3: #22070b;
    --gold: #e9c46a; --gold-2: #c99a3b; --cream: #fbf3e4; --muted: #e3cfc0;
    --card: rgba(255, 244, 228, .06); --line: rgba(233, 196, 106, .22);
    --display: "Fraunces", Georgia, serif; --body: "Inter", system-ui, sans-serif;
  }
  html[lang="fa"] { --display: "Vazirmatn", Tahoma, sans-serif; --body: "Vazirmatn", Tahoma, sans-serif; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  [id] { scroll-margin-top: 80px; }
  body {
    margin: 0; color: var(--cream); font-family: var(--body); line-height: 1.65;
    background: var(--felt-3);
    background-image:
      radial-gradient(1200px 700px at 70% -10%, rgba(233,196,106,.10), transparent 60%),
      radial-gradient(900px 900px at 50% 20%, var(--felt-1), var(--felt-2) 55%, var(--felt-3));
    background-attachment: fixed;
    overflow-x: hidden;
  }
  html[lang="fa"] body { line-height: 1.9; }
  a { color: var(--gold); }
  img { display: block; max-width: 100%; }
  .wrap { width: min(1160px, 100% - 32px); margin-inline: auto; }

  /* Header */
  header { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(10px);
           background: rgba(34, 7, 11, .72); border-bottom: 1px solid var(--line); }
  header .wrap { display: flex; align-items: center; gap: 12px; height: 64px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--cream);
           font-family: var(--display); font-weight: 800; font-size: 1.15rem; }
  .brand img { width: 36px; height: 36px; border-radius: 9px; }
  header nav { margin-inline-start: auto; display: flex; gap: 6px; align-items: center; }
  header nav a.link { color: var(--muted); text-decoration: none; font-size: .95rem; padding: 6px 10px; border-radius: 8px; }
  header nav a.link:hover { color: var(--cream); background: var(--card); }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .lang button { all: unset; cursor: pointer; padding: 5px 12px; font-size: .88rem; color: var(--muted); font-family: "Vazirmatn", "Inter", sans-serif; }
  .lang button[aria-pressed="true"] { background: var(--gold); color: #3a0d12; font-weight: 700; }

  /* Hero */
  .hero { position: relative; padding: 72px 0 56px; }
  .hero .wrap { display: grid; grid-template-columns: 1.1fr .9fr; gap: 40px; align-items: center; }
  .eyebrow { display: inline-flex; gap: 8px; align-items: center; color: var(--gold); font-weight: 600;
             letter-spacing: .04em; font-size: .9rem; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; }
  html[lang="en"] .eyebrow { text-transform: uppercase; font-size: .78rem; letter-spacing: .12em; }
  h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2.2rem, 5.2vw, 3.9rem); line-height: 1.08; margin: 18px 0 16px; }
  html[lang="fa"] h1 { line-height: 1.35; }
  h1 em { font-style: normal; color: var(--gold); white-space: nowrap; }
  .lede { font-size: 1.12rem; color: var(--muted); max-width: 34em; margin: 0 0 28px; }
  .cta { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 12px; font-weight: 600;
         text-decoration: none; border: 1px solid var(--line); color: var(--cream); background: var(--card); transition: transform .15s, background .15s; }
  .btn:hover { transform: translateY(-2px); background: rgba(255,244,228,.12); }
  .btn.primary { background: linear-gradient(180deg, var(--gold), var(--gold-2)); color: #3a0d12; border-color: transparent; }

  .fan { position: relative; height: 420px; direction: ltr; }
  .pc { position: absolute; inset-inline-start: 50%; top: 40px; width: 170px; height: 246px; border-radius: 14px;
        background: linear-gradient(160deg, #fffdf8, #f3eadb); box-shadow: 0 18px 40px rgba(0,0,0,.45);
        transform-origin: 50% 120%; color: #b3122a; font-family: "Fraunces", Georgia, serif; font-weight: 800;
        margin-inline-start: -85px; animation: deal .9s cubic-bezier(.2,.8,.2,1) both; }
  .pc.black { color: #1d1a1a; }
  .pc .ix { position: absolute; top: 10px; inset-inline-start: 12px; font-size: 1.6rem; line-height: 1; text-align: center; }
  .pc .ix.b { top: auto; bottom: 10px; inset-inline-start: auto; inset-inline-end: 12px; transform: rotate(180deg); }
  .pc .pip { position: absolute; inset: 0; display: grid; place-items: center; font-size: 5.2rem; }
  .pc:nth-child(1) { --r: -24deg; animation-delay: .05s; }
  .pc:nth-child(2) { --r: -8deg;  animation-delay: .15s; }
  .pc:nth-child(3) { --r: 8deg;   animation-delay: .25s; }
  .pc:nth-child(4) { --r: 24deg;  animation-delay: .35s; }
  .pc { transform: rotate(var(--r)); }
  @keyframes deal { from { opacity: 0; transform: translateY(80px) rotate(0deg) scale(.9); } to { opacity: 1; transform: rotate(var(--r)); } }
  .fan:hover .pc:nth-child(1) { transform: rotate(-30deg) translateY(-6px); }
  .fan:hover .pc:nth-child(4) { transform: rotate(30deg) translateY(-6px); }
  .pc { transition: transform .35s; }
  .chip { position: absolute; width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center;
          background: radial-gradient(circle, var(--gold) 0 46%, #8f1b2b 47% 100%); border: 6px dashed rgba(255,255,255,.55);
          box-shadow: 0 10px 24px rgba(0,0,0,.4); color: #3a0d12; font-size: 1.7rem; }
  .chip.c1 { inset-inline-start: 4%; bottom: 30px; animation: bob 5s ease-in-out infinite; }
  .chip.c2 { inset-inline-end: 2%; top: 10px; width: 58px; height: 58px; font-size: 1.3rem; animation: bob 6s ease-in-out infinite reverse; }
  @keyframes bob { 50% { transform: translateY(-10px); } }
  .suits-bg { position: absolute; inset: 0; pointer-events: none; opacity: .05; font-size: 120px; overflow: hidden; }
  .suits-bg span { position: absolute; }

  /* Features */
  .features { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 8px auto 72px; }
  .feat { padding: 20px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
  .feat .ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: rgba(233,196,106,.14); color: var(--gold); margin-bottom: 10px; }
  .feat h3 { margin: 0 0 4px; font-size: 1.02rem; }
  .feat p { margin: 0; color: var(--muted); font-size: .93rem; }

  /* Sections */
  section h2 { font-family: var(--display); font-size: clamp(1.7rem, 3.4vw, 2.5rem); margin: 0 0 8px; }
  section .sub { color: var(--muted); margin: 0 0 28px; max-width: 40em; }

  .hub { display: grid; grid-template-columns: 1fr 1.2fr; gap: 32px; align-items: center; padding: 32px; border-radius: 24px;
         background: linear-gradient(135deg, rgba(233,196,106,.16), rgba(255,244,228,.04)); border: 1px solid rgba(233,196,106,.38); margin-bottom: 80px; }
  .hub .badge { display: inline-block; font-size: .8rem; font-weight: 700; color: #3a0d12; background: var(--gold); padding: 3px 10px; border-radius: 999px; margin-bottom: 12px; }
  .hub .head { display: flex; gap: 16px; align-items: center; margin-bottom: 10px; }
  .hub .head img { width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 8px 22px rgba(0,0,0,.4); }
  .hub h3 { font-family: var(--display); font-size: 1.7rem; margin: 0; line-height: 1.25; }
  .hub p { color: var(--muted); }
  .hub .shots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 88px; }
  .game { display: flex; flex-direction: column; padding: 22px; border-radius: 20px; background: var(--card); border: 1px solid var(--line);
          transition: transform .2s, border-color .2s, box-shadow .2s; }
  .game:hover { transform: translateY(-3px); border-color: rgba(233,196,106,.5); box-shadow: 0 18px 40px rgba(0,0,0,.3); }
  .game .head { display: flex; gap: 14px; align-items: center; }
  .game .head img { width: 68px; height: 68px; border-radius: 16px; box-shadow: 0 6px 16px rgba(0,0,0,.35); flex: none; }
  .game h3 { margin: 0; font-size: 1.28rem; line-height: 1.3; }
  .game .tag { color: var(--gold); font-size: .92rem; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 6px; }
  .tags span { font-size: .8rem; padding: 3px 10px; border-radius: 999px; background: rgba(255,244,228,.08); color: var(--muted); border: 1px solid rgba(255,244,228,.1); }
  .game p { color: var(--muted); margin: 8px 0 16px; flex: 1; }
  .shots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .shots button { all: unset; cursor: zoom-in; border-radius: 12px; overflow: hidden; aspect-ratio: 9 / 16; background: rgba(0,0,0,.25); }
  .shots img { width: 100%; height: 100%; object-fit: cover; transition: transform .3s; }
  .shots button:hover img { transform: scale(1.04); }
  .shots button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .stores { display: flex; flex-wrap: wrap; gap: 8px; }
  .store { display: inline-flex; align-items: center; gap: 7px; font-size: .88rem; font-weight: 600; padding: 8px 14px; border-radius: 10px;
           text-decoration: none; color: var(--cream); background: rgba(0,0,0,.28); border: 1px solid rgba(255,244,228,.14); }
  a.store:hover { border-color: var(--gold); color: var(--gold); }
  .store.soon { color: var(--muted); opacity: .7; border-style: dashed; }
  .store svg { width: 16px; height: 16px; }

  .about { display: grid; grid-template-columns: 1.2fr .8fr; gap: 28px; padding: 32px; border-radius: 24px; background: var(--card); border: 1px solid var(--line); margin-bottom: 64px; }
  .about ul { margin: 0; padding-inline-start: 1.2em; color: var(--muted); }
  .about li { margin: .35em 0; }
  .contact { padding: 22px; border-radius: 16px; background: rgba(0,0,0,.22); }
  .contact h3 { margin: 0 0 6px; }
  .contact p { color: var(--muted); margin: 0 0 12px; }

  footer { border-top: 1px solid var(--line); padding: 28px 0 40px; color: var(--muted); font-size: .9rem; }
  footer .wrap { display: flex; flex-wrap: wrap; gap: 14px 28px; justify-content: space-between; }
  footer details summary { cursor: pointer; color: var(--cream); }
  footer details div { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; }

  /* Lightbox */
  dialog { border: 0; padding: 0; background: transparent; max-width: min(92vw, 460px); }
  dialog::backdrop { background: rgba(10, 2, 4, .86); }
  dialog img { width: 100%; max-height: 88vh; object-fit: contain; border-radius: 14px; }
  .close { position: fixed; top: 14px; inset-inline-end: 18px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
           background: rgba(255,255,255,.12); color: #fff; font-size: 1.4rem; cursor: pointer; border: 0; }

  .reveal { opacity: 0; transform: translateY(18px); transition: opacity .6s ease, transform .6s ease; }
  .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .reveal { opacity: 1; transform: none; }
  }

  @media (max-width: 920px) {
    .hero .wrap, .hub, .about { grid-template-columns: 1fr; }
    .fan { height: 330px; order: -1; }
    .pc { width: 130px; height: 188px; margin-inline-start: -65px; top: 30px; }
    .pc .pip { font-size: 4rem; }
    .features { grid-template-columns: repeat(2, 1fr); }
    .grid { grid-template-columns: 1fr; }
    .hero { padding-top: 36px; }
  }
  @media (max-width: 560px) {
    header nav a.link { display: none; }
    .features { grid-template-columns: 1fr; }
    .hub, .about { padding: 20px; }
    .game { padding: 18px; }
  }
</style>
</head>

  bt: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10-5 5V2l5 5L7 17"/></svg>',
  bot: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4M9 14h.01M15 14h.01"/></svg>',
  heart: '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 21s-7.5-4.6-9.5-9.3C1.1 8.3 3.3 5 6.6 5c2 0 3.4 1.1 4.4 2.5C12 6.1 13.4 5 15.4 5c3.3 0 5.5 3.3 4.1 6.7C19.5 16.4 12 21 12 21z"/></svg>',

  bag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 016 0v2"/></svg>'
};

const FA_DIGITS = s => s.replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
let lang = "en";

function storeLinks(g, t) {
  const pkg = "com.rahpoo." + g.id;
  const play = g.play
    ? `<a class="store" href="https://play.google.com/store/apps/details?id=${pkg}" rel="noopener">${ICONS.play}Google Play</a>`
    : `<span class="store soon">${ICONS.play}${t.soon}</span>`;
  const bazaar = g.bazaar ? `<a class="store" href="https://cafebazaar.ir/app/${pkg}" rel="noopener">${ICONS.bag}${lang === "fa" ? "کافه‌بازار" : "Cafe Bazaar"}</a>` : "";
  const myket = g.myket ? `<a class="store" href="https://myket.ir/app/${pkg}" rel="noopener">${ICONS.bag}${lang === "fa" ? "مایکت" : "Myket"}</a>` : "";
  return lang === "fa" ? bazaar + myket + play : play + bazaar + myket;
}

function shots(g, t, n) {
  const name = g[lang].name;
  let h = "";
  for (let i = 1; i <= n; i++) {
    h += `<button type="button" aria-label="${t.zoom}: ${name} ${i}"><img loading="lazy" decoding="async" src="img/${g.id}-${lang}-${i}.webp" alt="${name} — ${i}" width="420" height="747"></button>`;
  }
  return `<div class="shots">${h}</div>`;
}

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";
  document.title = t.brand;
  document.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = t[el.dataset.t]; });
  document.querySelectorAll("[data-icon]").forEach(el => { el.src = `img/${el.dataset.icon}-${lang}-icon.webp`; });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));

  document.getElementById("features").innerHTML = t.feats.map(([ic, h, p]) =>
    `<div class="feat reveal"><div class="ic">${ICONS[ic]}</div><h3>${h}</h3><p>${p}</p></div>`).join("");

  const hub = GAMES[0];
  document.getElementById("hub").innerHTML = `
    <div>
      <span class="badge">${t.hubBadge}</span>
      <div class="head"><img src="img/cardgames-${lang}-icon.webp" alt="" width="84" height="84"><h3>${hub[lang].name}</h3></div>
      <p><strong style="color:var(--gold)">${hub[lang].tag}.</strong> ${hub[lang].desc}</p>
      <div class="stores">${storeLinks(hub, t)}</div>
    </div>
    ${shots(hub, t, 3)}`;

  document.getElementById("grid").innerHTML = GAMES.slice(1).map(g => {
    const x = g[lang];
    const tags = [t.players[g.players], t.off].concat(g.bt ? [t.bt] : []);
    return `<article class="game reveal" id="${g.id}">
      <div class="head"><img loading="lazy" src="img/${g.id}-${lang}-icon.webp" alt="" width="68" height="68">
        <div><h3>${x.name}</h3><div class="tag">${x.tag}</div></div></div>
      <div class="tags">${tags.map(s => `<span>${s}</span>`).join("")}</div>
      <p>${x.desc}</p>
      ${shots(g, t, 3)}
      <div class="stores">${storeLinks(g, t)}</div>
    </article>`;
  }).join("");

  document.getElementById("promises").innerHTML = t.promises.map(p => `<li>${p}</li>`).join("");
  document.getElementById("privacy").innerHTML = GAMES.map(g =>
    `<a href="${PRIVACY}${g.id}.html">${g[lang].name}</a>`).join("");

  if (lang === "fa") {
    document.querySelectorAll(".tags span, .game p, .tag, .lede, .feat p").forEach(el => { el.textContent = FA_DIGITS(el.textContent); });
  }
  observe();
}

const lb = document.getElementById("lightbox");
document.addEventListener("click", e => {
  const b = e.target.closest(".shots button");
  if (b) { lb.querySelector("img").src = b.querySelector("img").src; lb.showModal(); return; }
  if (e.target === lb || e.target.closest(".close")) lb.close();
  const l = e.target.closest(".lang button");
  if (l && l.dataset.lang !== lang) {
    lang = l.dataset.lang;
    try { localStorage.setItem("lang", lang); } catch (_) {}
    history.replaceState(null, "", "?lang=" + lang + location.hash);
    render();
  }
});

let io;
function observe() {
  const els = document.querySelectorAll(".reveal:not(.in)");
  if (!("IntersectionObserver" in window)) { els.forEach(el => el.classList.add("in")); return; }
  io = io || new IntersectionObserver(entries => entries.forEach(en => {
    if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); }
  }), { rootMargin: "0px 0px -40px 0px" });
  els.forEach(el => io.observe(el));
}

(function init() {
  const q = new URLSearchParams(location.search).get("lang");
  let saved = null;
  try { saved = localStorage.getItem("lang"); } catch (_) {}
  const nav = (navigator.language || "").toLowerCase();
  lang = q === "fa" || q === "en" ? q : saved || (nav.startsWith("fa") ? "fa" : "en");
  render();
})();
</script>
